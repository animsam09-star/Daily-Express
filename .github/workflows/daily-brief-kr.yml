name: 한국증시 마감 브리핑

# 정시 발송은 외부 스케줄러(Claude Code Routine)가 workflow_dispatch 로
# 15:45 KST 정각에 쏘는 것이 1차 경로. 아래 schedule 은 그 백업이다 —
# GitHub cron 은 정시 보장이 없어 실측 2시간 반씩 지연됐다(15:45 목표가
# 18:16 시작). dispatch 가 이미 발송했으면 중복 발송 가드가 생략시킨다.
on:
  schedule:
    # 06:45 UTC = 15:45 KST. 장 마감(15:30) 정각은 종가가 아직 정리되지 않아
    # 동시호가 반영을 기다린 뒤 보낸다.
    # UTC 06:45 는 한국시간과 같은 날이므로 요일도 월~금(1-5) 그대로 쓴다.
    - cron: "45 6 * * 1-5"
  workflow_dispatch:        # 정시 발송(Routine) + 수동 실행(테스트용)
    inputs:
      web_only:
        description: '텔레그램 발송 없이 웹 대시보드만 갱신·배포'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read             # 중복 발송 가드가 최근 run 목록을 조회한다

jobs:
  send:
    runs-on: ubuntu-latest
    # 종목·지표가 늘면서 수집이 길어졌다(실측 23분+). 여유를 둔다.
    timeout-minutes: 45
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 웹 대시보드 배포용 (없으면 배포만 생략)
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # pages.dev 서브도메인은 전역 공용이라 흔한 이름은 이미 선점돼 있다
      # ('daily-express'는 남의 사이트). 계정명을 붙여 고유하게 만들고,
      # 바꾸고 싶으면 CLOUDFLARE_PAGES_PROJECT 시크릿으로 덮어쓴다.
      PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || format('daily-express-{0}', github.repository_owner) }}
    steps:
      # 지연 도착한 schedule 실행이, 정시 dispatch 가 이미 보낸 브리핑을
      # 또 보내지 않게 한다. 하루 1회 발송이므로 6시간 창이면 충분하다.
      # 조회 실패 시에는 발송하는 쪽으로 폴백(미발송보다 중복이 낫다).
      - name: 중복 발송 가드 (schedule 전용)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(date -u -d '6 hours ago' '+%Y-%m-%dT%H:%M:%S+00:00')
          DONE=$(gh run list -R "$GITHUB_REPOSITORY" -w daily-brief-kr.yml \
            --created ">=$CUTOFF" --json event,status,conclusion \
            -q '[.[] | select(.event == "workflow_dispatch")
                     | select(.conclusion == "success" or .status == "in_progress" or .status == "queued")] | length' || echo 0)
          if [ "${DONE:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "이미 정시 dispatch 로 발송됨 — 지연 스케줄 실행 생략"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Claude Code 설치
        if: steps.guard.outputs.skip != 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      # web_only 면 --dry-run: 수집·차트·웹 대시보드는 그대로 만들고
      # 텔레그램 발송만 생략한다. schedule 실행에서는 inputs 가 비어 false.
      - name: 브리핑 발송
        if: steps.guard.outputs.skip != 'true'
        run: python main_kr.py ${{ inputs.web_only == true && '--dry-run' || '' }}

      # ---- 웹 대시보드 (Cloudflare Pages) ---- daily-brief.yml 과 같은 구조
      - name: 웹 대시보드 아티팩트 보관
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-kr
          path: site/kr.html
          if-no-files-found: ignore
          retention-days: 14

      # 배포는 site/ 폴더를 통째로 갈아끼우므로, 반대 시장 페이지를 함께
      # 올리지 않으면 그 페이지가 사이트에서 사라진다.
      # 배포 직후에는 CDN 이 빈 응답(200 + 0 bytes)을 주는 일이 있어
      # (실제로 0 bytes 를 받아 us.html 이 빈 페이지로 덮였다)
      # 크기를 검증하고 재시도하며, 그래도 안 되면 아티팩트에서 회수한다.
      - name: 상대편(미국) 대시보드 회수
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://${{ env.PAGES_PROJECT }}.pages.dev/us.html"
          MIN=20000                      # 정상 페이지는 200KB 이상이다
          ok=""
          for i in 1 2 3; do
            if curl -fsS --max-time 60 -o site/us.html "$URL" \
               && [ "$(wc -c < site/us.html)" -ge "$MIN" ]; then
              echo "회수 성공: $URL ($(wc -c < site/us.html) bytes)"
              ok=1; break
            fi
            echo "회수 시도 $i 실패($(wc -c < site/us.html 2>/dev/null || echo 0) bytes) — 8초 후 재시도"
            rm -f site/us.html; sleep 8
          done
          if [ -z "$ok" ]; then
            echo "라이브 회수 실패 — 아티팩트에서 회수 시도"
            for RUN in $(gh run list -R "$GITHUB_REPOSITORY" -w daily-brief.yml \
                           -s success -L 5 --json databaseId -q '.[].databaseId'); do
              if gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n site-us -D site/ 2>/dev/null \
                 && [ "$(wc -c < site/us.html)" -ge "$MIN" ]; then
                echo "아티팩트 회수 성공(run $RUN, $(wc -c < site/us.html) bytes)"; ok=1; break
              fi
              rm -f site/us.html
            done
          fi
          [ -z "$ok" ] && echo "::warning::us.html 회수 실패 — 이번 배포에서 빠진다"
          exit 0

      - name: Cloudflare Pages 프로젝트 준비
        if: steps.guard.outputs.skip != 'true' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PAGES_PROJECT }} --production-branch=main

      - name: Cloudflare Pages 배포
        if: steps.guard.outputs.skip != 'true' && env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: 실패 시 차트 보관(원인 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: charts-kr
          path: out_kr/
          if-no-files-found: ignore

      # 실패하면 아무 일도 안 일어나 '그냥 안 온 것'과 구별되지 않는다.
      # 실패했다는 사실 자체를 텔레그램으로 알린다.
      - name: 실패 알림
        if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ 한국증시 마감 브리핑 발송 실패 — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
