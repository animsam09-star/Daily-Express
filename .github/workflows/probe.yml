name: 데이터 소스 프로브(임시)

# 개발 컨테이너는 야후·네이버가 프록시에서 막혀 있어(403), 새 소스를 붙일 때
# 응답 구조를 러너에서 실측한다. 확인이 끝나면 지운다.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_*.py", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_fundamentals.py
