name: 유니버스 프로브(임시)

# 개발 컨테이너는 야후·SSGA 가 프록시에서 막혀 있어, 유니버스를 넓힐 때
# '실제로 무엇이 오는지'를 러너에서 확인하려고 임시로 둔다.
# 작업이 끝나면 지운다.
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_universe.py", ".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_universe.py
