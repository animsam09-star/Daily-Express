name: probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt

      - name: 시세 갱신이 쓰는 코드 목록 받기
        run: |
          git fetch origin data --depth=1
          git show FETCH_HEAD:quotes.json > /tmp/quotes.json

      - name: 고친 접미사 판별을 전 종목 네이버 현재가와 대조
        run: |
          python - <<'PY'
          import json
          import re
          from concurrent.futures import ThreadPoolExecutor

          import kr_sources as kr
          import quotes_job as qj
          import sources

          codes = sorted(c for c in json.load(open("/tmp/quotes.json"))["kr"]["quotes"]
                         if re.fullmatch(r"\d{6}", c))
          print(f"검사 대상 {len(codes)}종목")

          resolved = qj.resolve_kr(codes)
          print(f"판별 성공 {len(resolved)} / 제외 {len(codes) - len(resolved)}\n")

          quotes = sources.fetch_quotes(sorted(resolved.values()))

          NOW_RE = re.compile(r"<dd>현재가\s*([\d,]+)")

          def naver(code):
              try:
                  m = NOW_RE.search(kr._page(
                      f"https://finance.naver.com/item/main.naver?code={code}"))
                  return int(m.group(1).replace(",", "")) if m else None
              except Exception:                         # noqa: BLE001
                  return None

          with ThreadPoolExecutor(max_workers=8) as ex:
              reals = dict(zip(codes, ex.map(naver, codes)))

          bad, unchecked, ok = [], [], 0
          for c in codes:
              sym = resolved.get(c)
              if not sym:
                  unchecked.append((c, "판별 실패로 제외됨"))
                  continue
              px, real = (quotes.get(sym) or {}).get("price"), reals.get(c)
              if px is None or real is None:
                  unchecked.append((c, f"대조 불가(야후 {px} / 네이버 {real})"))
                  continue
              gap = abs(px - real) / real * 100
              if gap > 2.0:            # 장중 시차를 감안해도 2% 넘게 벌어지면 다른 종목이다
                  bad.append((c, sym, px, real, gap))
              else:
                  ok += 1

          print(f"■ 일치 {ok}종목 (네이버 현재가와 2% 이내)")
          print(f"■ 불일치 {len(bad)}종목")
          for c, sym, px, real, gap in bad:
              print(f"   {c} {kr.stock_name(c)[:14]:14} {sym}  "
                    f"야후 {px:,.0f}  네이버 {real:,.0f}  차이 {gap:.1f}%")
          print(f"■ 대조 못 한 {len(unchecked)}종목")
          for c, why in unchecked[:25]:
              print(f"   {c} {why}")
          PY
