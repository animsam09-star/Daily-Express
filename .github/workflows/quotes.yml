name: 시세 갱신

# 브리핑 본문은 하루 한 번이고, 현재가·등락률·시가총액만 한 시간마다 새로
# 받아 data 브랜치의 quotes.json 에 남긴다. 페이지는 열릴 때 그 파일을 읽어
# 숫자를 덮어쓴다 — Cloudflare 배포를 건드리지 않으므로 대시보드 HTML 이
# 이 작업 때문에 깨질 일이 없다.
on:
  workflow_dispatch:
  schedule:
    # 국내장(09:00~15:30 KST = 00:00~06:30 UTC)과 미국장(대략 14:30~21:00
    # UTC)만 돈다. 장이 닫힌 시간에는 값이 안 바뀌므로 돌 이유가 없다.
    # 서머타임으로 미국장이 한 시간 밀려도 걸치도록 앞뒤를 한 시간씩 넓혔다.
    - cron: "5 0-7,13-22 * * 1-5"

permissions:
  contents: write             # data 브랜치에 quotes.json 을 밀어 넣는다

concurrency:
  group: quotes
  cancel-in-progress: false   # 앞 실행이 밀어 넣는 중이면 기다린다

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # data 브랜치는 코드가 아니라 데이터만 담는 고아 브랜치다. 없으면 만든다.
      - name: 직전 시세 받아두기
        run: |
          mkdir -p data
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git show FETCH_HEAD:quotes.json > data/quotes.json 2>/dev/null || true
          fi
          [ -s data/quotes.json ] || echo '{}' > data/quotes.json

      - name: 시세 조회
        run: python quotes_job.py --out data/quotes.json

      - name: data 브랜치에 반영
        run: |
          cd data
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b data
          git add quotes.json
          git commit -q -m "시세 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            data
