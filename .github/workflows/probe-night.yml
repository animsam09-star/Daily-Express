# 임시 진단 워크플로 — 코스피200 야간선물 데이터 소스 탐색.
# 개발 환경에서는 외부 시세 호스트가 막혀 있어 러너에서 확인한다.
# 소스가 정해지면 이 파일과 _probe_night.py 는 삭제한다.
name: probe-night
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python _probe_night.py
