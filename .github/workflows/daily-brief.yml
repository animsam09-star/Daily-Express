name: 마켓 브리핑 발송

on:
  schedule:
    # GitHub Actions cron 은 UTC. 21:05 UTC = 06:05 KST.
    # 요일도 UTC 기준이라 일~목(0-4) = 한국시간 월~금.
    #
    # 목표는 '06:30 까지 도착'. 더 당기지 않는 이유는 서머타임이다.
    # 미국장 마감은 여름 05:00 KST, 겨울 06:00 KST 라서 05:50 에 돌리면
    # 겨울에는 장중 값이 나간다. 06:05 면 겨울에도 마감 후 5분이고
    # 06:30 까지 25분이 남아 Actions 지연을 흡수할 수 있다.
    - cron: "5 21 * * 0-4"
  workflow_dispatch:        # 수동 실행(테스트용)

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # step 의 if 조건에서는 secrets 를 직접 못 쓴다(env 만 참조 가능).
    # 그래서 job 단위 env 로 한 번 받아둔다.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 시크릿 이름을 어느 쪽으로 등록했든 잡히도록 둘 다 넘긴다
      FINNHUB_API: ${{ secrets.FINNHUB_API }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          rm -rf ~/.cache/matplotlib

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 구독(Pro/Max) 토큰으로 뉴스 요약을 돌릴 때만 필요하다.
      # API 키를 쓰거나 요약을 안 쓰면 이 단계는 건너뛴다.
      - name: Claude Code 설치
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      # 시크릿은 job 단위 env 로 이미 주입돼 있다.
      # 요약용 인증이 하나도 없으면 요약만 빠지고 나머지는 그대로 발송된다.
      - name: 브리핑 발송
        run: python main.py

      - name: 실패 시 차트 보관(원인 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: out/
          if-no-files-found: ignore

      # 실패하면 아무 일도 안 일어나 '그냥 안 온 것'과 구별되지 않는다.
      # 실패했다는 사실 자체를 텔레그램으로 알린다.
      - name: 실패 알림
        if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ 미국 마켓 브리핑 발송 실패 — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
