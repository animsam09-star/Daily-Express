name: 한국 수집원 탐색(일회성)

# 네이버 금융 개편으로 수집이 통째로 죽었다. 새 수집원을 정하려면 후보
# 엔드포인트가 무엇을 돌려주는지 봐야 하는데, 개발 환경은 프록시가 막는다.
# 브리핑 전체(3분+배포)를 돌리지 않고 이것만 빠르게 확인한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python tools/probe_kr.py
